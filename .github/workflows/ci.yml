# Cross-platform build and test gate for ConMan.
#
# Keep action revisions pinned, matching the supply-chain posture used by the
# sibling SafeTunnel project. Successful, uncompressed release binaries are
# retained briefly for diagnostics; publishing and UPX finalization happen only
# in the release workflows after this gate succeeds.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    env:
      # The native UI/RDP dependency graph exhausts hosted-runner storage when
      # Clippy and test profiles both retain incremental state and full debug
      # symbols. CI diagnoses through textual output; release artifacts are
      # built separately below and do not need dev/test symbols.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux-x86_64
          - name: macOS arm64
            os: macos-14
            platform: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # BuildInfo uses the monotonic repository commit count.
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            openssh-client

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy

      - name: Bootstrap Zig 0.15.2 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval "$(scripts/bootstrap-zig.sh --export)"
          dirname "$(command -v zig)" >> "$GITHUB_PATH"
          zig version

      - name: Bootstrap Zig 0.15.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap-zig.ps1
          $zig = Get-ChildItem .zig -Filter zig.exe -Recurse | Select-Object -First 1
          if (-not $zig) { throw "Zig bootstrap produced no zig.exe" }
          $zig.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $zig.FullName version

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Lint all targets and features
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Test UI accessibility and interaction boundary
        run: cargo test --locked -p cm-ui --features ui-introspection

      - name: Test release staging contracts
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s scripts/dist -p 'test_*.py' -v

      - name: Build release executables
        run: cargo build --locked --workspace --release --bins

      - name: Stage uncompressed diagnostic artifact
        id: stage
        run: |
          python scripts/dist/prepare_release.py \
            --target-dir target/release \
            --stage-dir dist/raw \
            --platform ${{ matrix.platform }} \
            --skip-upx \
            --github-output "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload uncompressed diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-conman-${{ steps.stage.outputs.sanitized_version }}-${{ matrix.platform }}
          path: dist/raw/
          if-no-files-found: error
          retention-days: 7
