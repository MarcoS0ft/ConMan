name: Stable release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: [self-hosted, local-ci, Linux, X64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Match semantic tag and Cargo version
        id: version
        shell: bash
        run: |
          set -eu
          tag='${{ github.ref_name }}'
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH, got: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "conman") | .version')"
          if [[ -z "$cargo_version" || "$cargo_version" != "$version" ]]; then
            echo "Tag $tag does not match conman Cargo version $cargo_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    uses: ./.github/workflows/package-release.yml
    with:
      source_ref: ${{ github.sha }}
      expected_version: ${{ needs.validate.outputs.version }}
      run_tests: true
      sign_macos: true
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CONMAN_MACOS_APP_PROVISIONING_PROFILE: ${{ secrets.CONMAN_MACOS_APP_PROVISIONING_PROFILE }}
      CONMAN_MACOS_CLI_PROVISIONING_PROFILE: ${{ secrets.CONMAN_MACOS_CLI_PROVISIONING_PROFILE }}
      NOTARIZE_API_KEY_ID: ${{ secrets.NOTARIZE_API_KEY_ID }}
      NOTARIZE_API_KEY_ISSUER: ${{ secrets.NOTARIZE_API_KEY_ISSUER }}
      NOTARIZE_API_KEY_P8_BASE64: ${{ secrets.NOTARIZE_API_KEY_P8_BASE64 }}

  publish:
    name: Publish stable release
    needs: [validate, package]
    runs-on: [self-hosted, local-ci, Linux, X64]
    steps:
      - name: Download packed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ConMan ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
