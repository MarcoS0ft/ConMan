# Shared release builder. Callers provide an immutable commit/tag ref; every
# platform checks out and packages that exact source revision.

name: Package release

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit or tag to build
        required: true
        type: string
      expected_version:
        description: Exact version required from the executable; empty for dev builds
        required: false
        default: ''
        type: string
      run_tests:
        description: Run the workspace test suite before packaging
        required: false
        default: false
        type: boolean
      sign_macos:
        description: Require Developer ID signing and Apple notarization for macOS
        required: false
        default: false
        type: boolean
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      CONMAN_MACOS_APP_PROVISIONING_PROFILE:
        required: false
      CONMAN_MACOS_CLI_PROVISIONING_PROFILE:
        required: false
      NOTARIZE_API_KEY_ID:
        required: false
      NOTARIZE_API_KEY_ISSUER:
        required: false
      NOTARIZE_API_KEY_P8_BASE64:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    env:
      # Avoid retaining multiple debug variants before the separately optimized
      # release build is staged on the persistent organization runners.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: Linux
            arch: X64
            platform: linux-x86_64
            python: python3
          - name: macOS arm64
            os: macOS
            arch: ARM64
            platform: macos-arm64
            python: python3
          - name: Windows x86_64
            os: Windows
            arch: X64
            platform: windows-x86_64
            python: py -3

    runs-on: [self-hosted, local-ci, "${{ matrix.os }}", "${{ matrix.arch }}"]
    timeout-minutes: 180

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          clean: false

      - name: Clean workspace while preserving compiler caches
        run: |
          git reset --hard
          git clean -ffdx -e target/ -e .zig/

      - name: Verify exact checkout
        run: >-
          ${{ matrix.python }} scripts/dist/verify_checkout.py
          '${{ inputs.source_ref }}'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              binutils \
              desktop-file-utils \
              pkg-config \
              libfontconfig1-dev \
              libgl1-mesa-dev \
              libwayland-dev \
              libx11-xcb-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxkbcommon-dev \
              openssh-client \
              podman \
              rpm
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y \
              binutils \
              desktop-file-utils \
              pkgconf-pkg-config \
              fontconfig-devel \
              mesa-libGL-devel \
              wayland-devel \
              libX11-devel \
              libxcb-devel \
              libxkbcommon-devel \
              openssh-clients \
              podman \
              rpm-build
          else
            echo "Unsupported Linux package manager" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Bootstrap Zig 0.15.2 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval "$(scripts/bootstrap-zig.sh --export)"
          dirname "$(command -v zig)" >> "$GITHUB_PATH"
          zig version

      - name: Bootstrap Zig 0.15.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap-zig.ps1
          $zig = Get-ChildItem .zig -Filter zig.exe -Recurse | Select-Object -First 1
          if (-not $zig) { throw "Zig bootstrap produced no zig.exe" }
          $zig.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $zig.FullName version

      - name: Test workspace
        if: inputs.run_tests
        run: cargo test --locked --workspace

      - name: Test UI accessibility and interaction boundary
        if: inputs.run_tests
        run: cargo test --locked -p cm-ui --features ui-introspection

      - name: Test release staging contracts
        if: runner.os == 'Linux' && inputs.run_tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/dist -p 'test_*.py' -v

      - name: Test Linux packaging contracts
        if: runner.os == 'Linux'
        run: scripts/package/linux/test-packaging.sh

      - name: Test macOS CLI installer contract
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/package/macos/test-installer.sh

      - name: Require NSIS 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $candidate) {
            $candidate = Get-Command makensis -ErrorAction SilentlyContinue
          }
          if (-not $candidate) {
            $known = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
            if ($known) { $candidate = Get-Item -LiteralPath $known }
          }
          if (-not $candidate) {
            throw "NSIS 3 is required on the Windows packaging runner"
          }
          $makeNsis = if ($candidate.Source) { $candidate.Source } else { $candidate.FullName }
          & $makeNsis /VERSION

      - name: Test Windows packaging contracts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          ./scripts/package/windows/test-update-path.ps1
          py -3 -m unittest scripts/package/windows/test_windows_packaging.py -v

      - name: Build release executables
        if: runner.os != 'Linux'
        run: cargo build --locked --workspace --release --bins

      - name: Stage, compress, and verify release executables
        if: runner.os != 'Linux'
        id: prepare
        run: >-
          ${{ matrix.python }} scripts/dist/prepare_release.py
          --target-dir target/release
          --stage-dir dist/stage
          --platform '${{ matrix.platform }}'
          --expected-version '${{ inputs.expected_version }}'

      - name: Build Linux native and portable packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          scripts/package/linux/build-portable-container.sh dist/packages
          scripts/package/linux/build-static-container.sh dist/packages

      - name: Build ad-hoc-signed macOS app and DMG
        if: runner.os == 'macOS' && !inputs.sign_macos
        shell: bash
        run: |
          scripts/package/macos/release.sh \
            --target-dir dist/stage \
            --output-dir dist/macos-build \
            --version '${{ steps.prepare.outputs.version }}' \
            --sign-identity -

      - name: Build signed and notarized macOS app and DMG
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.CONMAN_MACOS_APP_PROVISIONING_PROFILE }}
          CLI_PROFILE_BASE64: ${{ secrets.CONMAN_MACOS_CLI_PROVISIONING_PROFILE }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARIZE_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARIZE_API_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARIZE_API_KEY_ISSUER }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD APP_PROFILE_BASE64 CLI_PROFILE_BASE64 NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_KEY_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Required macOS release secret is missing: $name" >&2
              exit 1
            fi
          done

          release_state="$(mktemp -d "${TMPDIR:-/tmp}/conman-signing.XXXXXX")"
          keychain="$release_state/build.keychain-db"
          keychain_password="$(uuidgen)"
          cleanup_signing() {
            original_status=$?
            trap - EXIT
            cleanup_status=0
            if [[ -f "$release_state/original-keychains.txt" ]]; then
              original=()
              while IFS= read -r existing; do
                [[ -n "$existing" ]] && original+=("$existing")
              done < "$release_state/original-keychains.txt"
              if [[ "${#original[@]}" -gt 0 ]]; then
                security list-keychains -d user -s "${original[@]}" || cleanup_status=1
              fi
            fi
            if [[ -e "$keychain" ]]; then
              security delete-keychain "$keychain" || cleanup_status=1
            fi
            rm -rf -- "$release_state" || cleanup_status=1
            if [[ "$cleanup_status" -ne 0 ]]; then
              echo "Failed to remove temporary macOS signing state" >&2
              exit 1
            fi
            exit "$original_status"
          }
          trap cleanup_signing EXIT

          printf '%s' "$CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$release_state/certificate.p12"
          printf '%s' "$APP_PROFILE_BASE64" | /usr/bin/base64 -D > "$release_state/conman.provisionprofile"
          printf '%s' "$CLI_PROFILE_BASE64" | /usr/bin/base64 -D > "$release_state/conmanctl.provisionprofile"
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D > "$release_state/notary.p8"
          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' \
            > "$release_state/original-keychains.txt"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$release_state/certificate.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "Imported certificate contains no Developer ID Application identity" >&2
            exit 1
          fi

          scripts/package/macos/release.sh \
            --target-dir dist/stage \
            --output-dir dist/macos-build \
            --version '${{ steps.prepare.outputs.version }}' \
            --sign-identity "$identity" \
            --app-provisioning-profile "$release_state/conman.provisionprofile" \
            --cli-provisioning-profile "$release_state/conmanctl.provisionprofile" \
            --notary-key "$release_state/notary.p8" \
            --notary-key-id "$NOTARY_KEY_ID" \
            --notary-issuer "$NOTARY_KEY_ISSUER"

      - name: Collect macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/packages
          cp dist/macos-build/*.dmg dist/macos-build/*.dmg.sha256 dist/packages/

      # Authenticode signing belongs between prepare_release.py and this step.
      # UPX has already finalized and verified the staged Windows executables.
      - name: Build Windows installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package/windows/build.ps1 -StageDir dist/stage -OutputDir dist/packages

      - name: Upload native release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
