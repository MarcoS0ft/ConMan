# Shared release builder. Callers provide an immutable commit/tag ref; every
# platform checks out and packages that exact source revision.

name: Package release

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit or tag to build
        required: true
        type: string
      expected_version:
        description: Exact version required from the executable; empty for dev builds
        required: false
        default: ''
        type: string
      run_tests:
        description: Run the workspace test suite before packaging
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    env:
      # Avoid retaining multiple debug variants before the separately optimized
      # release build is staged on the persistent organization runners.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: Linux
            arch: X64
            platform: linux-x86_64
          - name: macOS arm64
            os: macOS
            arch: ARM64
            platform: macos-arm64
          - name: Windows x86_64
            os: Windows
            arch: X64
            platform: windows-x86_64

    runs-on: [self-hosted, "${{ matrix.os }}", "${{ matrix.arch }}"]
    timeout-minutes: 75

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          clean: false

      - name: Clean workspace while preserving compiler caches
        run: |
          git reset --hard
          git clean -ffdx -e target/ -e .zig/

      - name: Verify exact checkout
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$(git rev-parse '${{ inputs.source_ref }}^{commit}')"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              pkg-config \
              libfontconfig1-dev \
              libgl1-mesa-dev \
              libwayland-dev \
              libx11-xcb-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxkbcommon-dev \
              openssh-client
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y \
              pkgconf-pkg-config \
              fontconfig-devel \
              mesa-libGL-devel \
              wayland-devel \
              libX11-devel \
              libxcb-devel \
              libxkbcommon-devel \
              openssh-clients
          else
            echo "Unsupported Linux package manager" >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Bootstrap Zig 0.15.2 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval "$(scripts/bootstrap-zig.sh --export)"
          dirname "$(command -v zig)" >> "$GITHUB_PATH"
          zig version

      - name: Bootstrap Zig 0.15.2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/bootstrap-zig.ps1
          $zig = Get-ChildItem .zig -Filter zig.exe -Recurse | Select-Object -First 1
          if (-not $zig) { throw "Zig bootstrap produced no zig.exe" }
          $zig.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $zig.FullName version

      - name: Test workspace
        if: inputs.run_tests
        run: cargo test --locked --workspace

      - name: Test UI accessibility and interaction boundary
        if: inputs.run_tests
        run: cargo test --locked -p cm-ui --features ui-introspection

      - name: Test release staging contracts
        if: runner.os == 'Linux' && inputs.run_tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/dist -p 'test_*.py' -v

      - name: Build release executables
        run: cargo build --locked --workspace --release --bins

      - name: Stage, compress, and verify release executables
        id: prepare
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -eu
          python_bin="$(command -v python3 || command -v python)"
          expected_args=()
          if [[ -n "$EXPECTED_VERSION" ]]; then
            expected_args=(--expected-version "$EXPECTED_VERSION")
          fi
          "$python_bin" scripts/dist/prepare_release.py \
            --target-dir target/release \
            --stage-dir dist/stage \
            --platform '${{ matrix.platform }}' \
            --github-output "$GITHUB_OUTPUT" \
            "${expected_args[@]}"

      # Future platform signing belongs here: UPX has completed and passed its
      # integrity/smoke tests, while no archive or checksum exists yet.
      - name: Signing boundary
        shell: bash
        run: echo "Unsigned build; platform signing will run at this boundary."

      - name: Archive and checksum staged files
        id: archive
        shell: bash
        run: |
          python_bin="$(command -v python3 || command -v python)"
          "$python_bin" scripts/dist/package_release.py \
            --stage-dir dist/stage \
            --output-dir dist/packages \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload packed release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.prepare.outputs.sanitized_version }}-${{ matrix.platform }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
