# Publish a single rolling prerelease only after the complete master CI workflow
# succeeds. The workflow_run SHA, not the then-current master HEAD, is rebuilt.

name: Dev build (rolling)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/package-release.yml
    with:
      source_ref: ${{ github.event.workflow_run.head_sha }}
      run_tests: false

  publish:
    name: Publish rolling dev prerelease
    needs: package
    runs-on: [self-hosted, local-ci, Linux, X64]
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download packed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          set -eu
          short_sha="$(git rev-parse --short=10 HEAD)"
          {
            echo "Automated build from master; this is not a stable release."
            echo
            echo "- Commit: \`${short_sha}\`"
            echo "- Tested by CI run: ${{ github.event.workflow_run.html_url }}"
            echo "- Release run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Windows and Linux application executables are compressed with checksum-verified UPX 5.2.0. macOS is not UPX-compressed."
          } > release-notes.md

      - name: Remove previous rolling release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          probe="$(mktemp)"
          trap 'rm -f "$probe"' EXIT

          # Ignore exactly one expected condition: the rolling release does not
          # exist yet. Authentication, permission, rate-limit, and API failures
          # must stop publication instead of leaving stale assets/tag state.
          if gh api "repos/${{ github.repository }}/releases/tags/dev" >"$probe" 2>&1; then
            gh release delete dev \
              --repo "${{ github.repository }}" \
              --yes \
              --cleanup-tag
          else
            status=$?
            if grep -Eq 'HTTP[^0-9]*404|\(HTTP 404\)' "$probe"; then
              echo "No existing dev release; creating the first one."
            else
              cat "$probe" >&2
              echo "Unable to determine whether the dev release exists." >&2
              exit "$status"
            fi
          fi

          # A stale remote tag would make the next release point at old source.
          set +e
          git ls-remote --exit-code --tags origin refs/tags/dev >"$probe" 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              cat "$probe" >&2
              echo "The stale dev tag still exists after release cleanup." >&2
              exit 1
              ;;
            2) echo "Verified that the previous dev tag is absent." ;;
            *)
              cat "$probe" >&2
              echo "Unable to verify removal of the previous dev tag." >&2
              exit "$tag_status"
              ;;
          esac

      - name: Publish rolling prerelease at tested SHA
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: dev
          name: Dev build (rolling)
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: dist/*
          fail_on_unmatched_files: true

      - name: Verify rolling release and tag revision
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -eu
          release_target="$(gh api \
            "repos/${{ github.repository }}/releases/tags/dev" \
            --jq '.target_commitish')"
          if [[ "$release_target" != "$EXPECTED_SHA" ]]; then
            echo "Dev release targets $release_target, expected $EXPECTED_SHA" >&2
            exit 1
          fi

          # Force-fetch over any old local dev tag left by the full-history
          # checkout, then dereference annotated or lightweight tags uniformly.
          git fetch --force origin '+refs/tags/dev:refs/tags/dev'
          tag_target="$(git rev-parse 'refs/tags/dev^{commit}')"
          if [[ "$tag_target" != "$EXPECTED_SHA" ]]; then
            echo "Dev tag targets $tag_target, expected $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "Verified rolling release and dev tag at $EXPECTED_SHA"
