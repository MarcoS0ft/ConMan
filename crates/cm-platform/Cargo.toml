[package]
name = "cm-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
# Resolves per-OS standard user directories (data, config, cache).
# P6.3 (gap 29): consolidated on `dirs` — the same crate already used by
# cm-session and cm-ui — replacing `directories`, which only had this one
# call site here. No memo required (dep already approved/present workspace-wide).
dirs = "6"
# Safe cross-platform opened-handle identity checks for the config writer lock.
# Already present in the workspace lockfile through existing dependencies.
same-file = "1"
# Stable, path-identity digest for identity-scoped single-instance handshakes.
# Already present in the workspace dependency graph.
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
# Structured logging facade (P6.3). The composition root (`conman`) installs
# the actual subscriber; libraries only ever call the `tracing::*` macros.
tracing = "0.1"

# P6.8 (gap 10, OS accent read) — new-dep memo:
# docs/devel/memos/P6.8-accent-platform-deps.md. Both are already present in
# the resolved workspace lockfile transitively (via Slint's winit backend on
# their respective OS), MIT-licensed, target-gated so neither OS pulls the
# other's dependency.
[target.'cfg(target_os = "linux")'.dependencies]
# Session D-Bus client (blocking API) for the freedesktop `Settings` portal
# read (`org.freedesktop.appearance`/`accent-color`) and its `SettingChanged`
# live-update signal.
zbus = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `DwmGetColorizationColor` (Win32_Graphics_Dwm) for the OS accent read;
# `Get`/`SetConsoleMode` (Win32_System_Console) for the stderr VT-processing
# probe/enable in `console.rs` (`Win32_Foundation` comes in transitively via
# `Win32_System_Console` -> `Win32_System` -> `Win32` -> `Win32_Foundation`).
windows = { version = "0.62", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
