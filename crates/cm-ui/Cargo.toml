[package]
name = "cm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
# Slint 1.17. Native windowing/GPU backends remain selected by composition roots.
slint = { version = "=1.17.0", default-features = false, features = ["std", "compat-1-2"] }
# Shared pure shaping/rasterization; platform fallback features are target-specific below.
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
unicode-script = "0.5"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cm-update = { path = "../cm-update" }
cm-storage = { path = "../cm-storage" }
cm-platform = { path = "../cm-platform" }
cm-session = { path = "../cm-session" }
# Native import/export wiring reports skipped secrets from the storage envelope.
serde_json = "1"
# Native RDP clipboard sync and import/export file dialogs.
arboard = { version = "3", features = ["wayland-data-control"] }
rfd = "0.17"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash", "wasm-web"] }
web-time = "=1.1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[features]
# Off by default, with no dependency changes of its own. When enabled, build.rs compiles
# ui/app.slint with Slint compiler debug info (element ids/roles/labels), which
# i-slint-backend-testing's ElementHandle queries need to resolve anything at all. This is
# what tests/a11y_audit.rs runs under. A default (feature-off) build — including
# `--release` — stays debug-info-free: no element-name strings in the shipped binary.
ui-introspection = []
# Leaf feature (empty for now): the Settings "Automation / Agent mode"
# section, the persistent active indicator, and the execute-scope
# session-launch gate compile behind this. Off by default, like
# `ui-introspection`.
agent-mode = []

[dev-dependencies]
# Already a workspace dep (dev-only, in cm-storage) — used here for
# import/export seam tests (fresh scratch dirs for exported/imported files).
tempfile = "3"
# Slint's own testing backend — instantiate AppWindow headlessly (no display, no
# event loop) and walk its element tree via ElementHandle for the a11y audit test
# (tests/a11y_audit.rs). Dev-only, never shipped. Internal/non-semver crate per its own
# docs — pinned exact, bump only in lockstep with the `slint` version above.
i-slint-backend-testing = "=1.17.0"

[build-dependencies]
# Compiles `ui/app.slint` into Rust (consumed via `slint::include_modules!`).
slint-build = "=1.17.0"

[lints]
workspace = true
