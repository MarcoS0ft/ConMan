[package]
name = "cm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
cm-storage = { path = "../cm-storage" }
# The local terminal session (PTY + libghostty engine, on its own threads). Brings in the
# zig-built engine via its default `engine-libghostty` feature.
cm-session = { path = "../cm-session" }
# Slint 1.17. Default features stay off here: cm-ui defines the UI components and the
# headless renderer, but the windowing backend + GPU renderer are selected by the `conman`
# binary (feature unification). This keeps `cargo test -p cm-ui` free of any display/GL
# requirement. `std` + `compat-1-2` are enough to compile the generated component code and
# the renderer's `SharedPixelBuffer`/`Image` value types.
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2"] }
# Software glyph rasterizer carried forward from the P0.3 spike.
fontdue = "0.9"
# dirs: provides the platform app-data directory for the persistent cert store (P4.2).
dirs = "6"
# arboard: cross-platform clipboard access for RDP CLIPRDR bidirectional sync (P4.2).
# See docs/devel/memos/p4.2-clipboard-dep.md for the rationale.
arboard = "3"
# Structured logging facade (P6.3). The composition root (`conman`) installs
# the actual subscriber; libraries only ever call the `tracing::*` macros.
tracing = "0.1"
# serde_json: already a workspace dependency (cm-core, cm-storage, cm-session); made
# direct here, optional, only pulled in by the `qa-harness` feature (P6.2b) to parse
# the JSON-lines QA-endpoint protocol. No new crate added to the dependency graph.
serde_json = { version = "1", optional = true }
# png: PNG encoder for the `qa-harness` feature's `screenshot` command (P6.2b). Already
# resolved in the workspace lockfile transitively (via `image`/`tiny-skia`/`muda`, all
# pulled in by Slint's own dependency graph) — adding it as a direct, feature-gated dep
# of cm-ui adds no new crate version. See docs/devel/memos/P6.2b-png-encoder-new-dep.md.
png = { version = "0.18", optional = true }

[features]
# Off by default (dev-facing only): a loopback JSON-lines QA endpoint used by agents to
# drive/inspect/screenshot the running app. Never present in a normal `--release` build
# unless explicitly opted in. See docs/devel/tasks/P6.2b-remote-qa-harness.md.
qa-harness = ["dep:serde_json", "dep:png"]

[build-dependencies]
# Compiles `ui/app.slint` into Rust (consumed via `slint::include_modules!`).
slint-build = "1.17"

[lints]
workspace = true
