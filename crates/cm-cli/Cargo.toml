[package]
name = "cm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["headless"]
headless = [
    "dep:click-rs",
    "dep:rich-click-rs",
    "dep:rich-rs",
    "dep:cm-core",
    "dep:cm-platform",
    "dep:cm-secrets",
    "dep:cm-storage",
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:thiserror",
]

[dependencies]
click-rs = { version = "=1.0.2", optional = true }
rich-click-rs = { version = "=1.0.2", optional = true }
rich-rs = { version = "=1.2.2", optional = true }
cm-build-info = { path = "../cm-build-info" }
cm-core = { path = "../cm-core", optional = true }
cm-platform = { path = "../cm-platform", optional = true }
cm-secrets = { path = "../cm-secrets", optional = true }
cm-storage = { path = "../cm-storage", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
