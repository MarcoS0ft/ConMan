[package]
name = "cm-session"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The libghostty-vt VT engine adapter (validated GO-WITH-CAVEATS in P0.2).
# Default on. Building it requires the zig 0.15.2 toolchain (see
# docs/devel/AI_GUIDANCE.md); on Windows debug builds, also
# LIBGHOSTTY_VT_SYS_OPTIMIZE=ReleaseSafe.
default = ["engine-libghostty"]
# The libghostty engine + the terminal sessions that drive it (local PTY + SSH).
# portable-pty/russh are tied in here so a zig-free `--no-default-features`
# build stays minimal. tokio and dirs are unconditional since P4.1 RDP always
# needs them.
engine-libghostty = [
    "dep:libghostty-vt",
    "dep:portable-pty",
    "dep:russh",
    "dep:dirs",
]
# Future pure-Rust fallback engine (alacritty_terminal) — not implemented yet.
# Exists so a zig-free build is possible once the fallback lands.
engine-alacritty = []

[dependencies]
cm-core = { path = "../cm-core" }
thiserror = "2"
# Pinned to the exact versions validated in the P0.2 spike.
libghostty-vt = { version = "=0.2.0", optional = true }
portable-pty = { version = "0.9.0", optional = true }
# SSH transport (P3.1). russh 0.61 re-exports keys/agent/known_hosts via `russh::keys`.
# Use the `ring` crypto backend (not the default `aws-lc-rs`, which needs NASM + a C
# build that fails on MSVC); keep `rsa` (RSA keys) and `flate2` (compression).
russh = { version = "0.61", optional = true, default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
] }
dirs = { version = "6", optional = true }
# P4.1: IronRDP pure-Rust RDP client (versions verified 2026-06-28 against crates.io).
# ironrdp-connector 0.9, ironrdp-session 0.10, ironrdp-tokio 0.9, ironrdp-graphics 0.8.1,
# ironrdp-input 0.6, ironrdp-pdu 0.8, ironrdp-svc 0.7, ironrdp-cliprdr 0.6.
# TLS uses rustls with ring backend to avoid aws-lc-rs / NASM requirement (P3.1 lesson).
ironrdp-connector = "0.9"
ironrdp-core = "0.2"
ironrdp-session = "0.10"
ironrdp-tokio = "0.9"
ironrdp-graphics = "0.8"
ironrdp-input = "0.6"
ironrdp-pdu = "0.8"
ironrdp-svc = "0.7"
ironrdp-cliprdr = "0.6"
ironrdp-tls = { version = "0.2", features = ["rustls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
x509-cert = "0.2"
# SHA-256 fingerprinting for TOFU certificate verification (P4.1).
sha2 = "0.10"
# tokio is unconditional (P4.1 RDP always needs it; SSH also uses it when
# engine-libghostty is on).
tokio = { version = "1", features = [
    "rt",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
serde_json = "1"

[lints]
workspace = true
