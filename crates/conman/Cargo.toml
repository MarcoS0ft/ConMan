[package]
name = "conman"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "conman"
path = "src/main.rs"

[features]
# Forwards to cm-ui's qa-harness feature (P6.2b). Off by default; opt in with
# `cargo build -p conman --features qa-harness` (or `conman/qa-harness` from the
# workspace root).
qa-harness = ["cm-ui/qa-harness"]

[dependencies]
cm-ui = { path = "../cm-ui" }
cm-core = { path = "../cm-core" }
cm-storage = { path = "../cm-storage" }
cm-secrets = { path = "../cm-secrets" }
cm-platform = { path = "../cm-platform" }
# P6.15 (gap 27): the composition root is the only place that names the
# concrete `SessionProviderImpl` adapter, injected into `cm-ui` as
# `Arc<dyn cm_core::SessionProvider>` (mirrors `cm-storage`/`cm-secrets` above).
cm-session = { path = "../cm-session" }
# The composition root selects the real Slint backend + renderers. femtovg is the GPU path
# chosen in P0.3; the software renderer is the `SLINT_BACKEND=software` fallback for
# headless/CI. Feature unification enables these on the single shared `slint` build for the
# whole dependency graph (cm-ui declares slint with default features off).
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
] }
# Structured logging (P6.3, new dep — pre-approved by the P6.3 spec, all
# MIT-licensed): the composition root is the only place that installs a
# subscriber. Console layer in debug; a rotating file layer under
# `cm_platform::app_log_dir()` in release, since `windows_subsystem =
# "windows"` swallows stderr there. `env-filter` backs the `CONMAN_LOG`
# override (RUST_LOG-compatible syntax).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[build-dependencies]
# Build-graph edge so conman's build script runs AFTER the engine's native build
# and receives its `links` metadata (DEP_GHOSTTY_VT_INCLUDE) — used by build.rs to
# place ghostty-vt.dll next to conman.exe on Windows. Pinned to match the engine.
libghostty-vt-sys = "=0.2.0"

# ── Keyring: platform-native backend for each OS (P5.4) ──────────────────────
# Feature unification: these add to the features keyring is compiled with.
# cm-secrets uses keyring with no features (mock-only for tests/CI); the binary
# opts in to the real OS backend here.  Graceful fallback: init_keyring() falls
# back to the mock backend if the native backend returns an error (e.g. headless
# CI with no display, broken Secret Service socket).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[lints]
workspace = true
