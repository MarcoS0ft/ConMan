[package]
name = "cm-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# mRemoteNG decryption uses RustCrypto (MIT/Apache-2.0). Pinned to
# `=0.11.0-rc.4` to match the exact pre-release
# `ironrdp-connector`'s vendored `picky` already locks the workspace to
# (Cargo.lock) — any other version range fails resolution (two `aes-gcm`
# majors can't coexist here) and this avoids a second copy of the crate.
aes-gcm = "=0.11.0-rc.4"
# Decodes the base64 blob wrapping salt|nonce|ciphertext+tag. Already in the
# workspace tree at this version (transitively) — matched, not a new copy.
base64 = "0.22.1"
cm-core = { path = "../cm-core" }
# CSV reader for the `.csv` importer — RFC 4180
# quoting/escaping (needed for the multi-line PEM in `ssh_private_key_pem`)
# plus free line-number tracking for accurate "row N" warnings. MIT OR
# Unlicense.
csv = "1"
# PBKDF2-HMAC-SHA1 key derivation. hmac/pbkdf2/sha1 versions match
# to what's already resolved in the workspace tree (transitively, via the
# same picky/sspi vendor path as aes-gcm) to avoid duplicate copies.
hmac = "0.13.0"
pbkdf2 = "0.13.0"
# XML pull-parser for mRemoteNG's `confCons.xml` — attribute reads on
# `<Node>` elements. Version matched to the workspace's existing resolution.
quick-xml = "0.39.4"
# rusqlite with bundled SQLite.
# "bundled" links the SQLite amalgamation; no system SQLite dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# serde is already a workspace dep (via cm-core); made direct here so
# json_io can use the derive macros on its own public types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
thiserror = "2"
# Structured logging: DB open/migration/import diagnostics. The
# composition root (`conman`) installs the subscriber; this crate only calls
# the `tracing::*` macros.
tracing = "0.1"

[dev-dependencies]
# Provides NamedTempFile / TempDir for the file-backed persistence test.
tempfile = "3"

[lints]
workspace = true
