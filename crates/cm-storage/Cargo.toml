[package]
name = "cm-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
# CSV reader for the P9.3 `.csv` importer (memos/P9.3-csv-dep.md) — RFC 4180
# quoting/escaping (needed for the multi-line PEM in `ssh_private_key_pem`)
# plus free line-number tracking for accurate "row N" warnings. MIT OR
# Unlicense.
csv = "1"
# rusqlite with bundled SQLite — approved dep (P1.1 spec).
# "bundled" links the SQLite amalgamation; no system SQLite dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# serde is already a workspace dep (via cm-core); made direct here so
# json_io can use the derive macros on its own public types.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Structured logging (P9.8): DB open/migration/import diagnostics. The
# composition root (`conman`) installs the subscriber; this crate only calls
# the `tracing::*` macros.
tracing = "0.1"

[dev-dependencies]
# Provides NamedTempFile / TempDir for the file-backed persistence test.
tempfile = "3"

[lints]
workspace = true
