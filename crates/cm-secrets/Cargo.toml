[package]
name = "cm-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
# keyring 3.x — the mock backend is always compiled in (no feature flag needed),
# while target sections below make the native builders available to every
# composition root through cm_secrets::initialize_native_keyring().
keyring = { version = "3.6" }
# Structured logging (P9.8): backend-name/error diagnostics only — never a
# secret value. The composition root (`conman`) installs the subscriber; this
# crate only calls the `tracing::*` macros.
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[lints]
workspace = true
