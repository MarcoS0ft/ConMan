[package]
name = "cm-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
# Structured logging (P9.8): backend-name/error diagnostics only — never a
# secret value. The composition root (`conman`) installs the subscriber; this
# crate only calls the `tracing::*` macros.
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
keyring = { version = "3.6" }

[lints]
workspace = true
