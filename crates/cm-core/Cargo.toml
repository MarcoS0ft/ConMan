[package]
name = "cm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Promoted from a dev-dependency. `app_settings` (now in this crate)
# `cm-storage::settings`) serializes the session-tab-restore snapshot to
# JSON through the `settings(key, value)` repository port — already an
# in-workspace, already-vetted crate (cm-storage/cm-session use it the same
# way).
serde_json = "1"
thiserror = "2"
zeroize = "1"

[lints]
workspace = true
