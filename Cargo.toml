[workspace]
resolver = "3"
members = [
    "crates/cm-core",
    "crates/cm-storage",
    "crates/cm-secrets",
    "crates/cm-session",
    "crates/cm-platform",
    "crates/cm-ui",
    "crates/conman",
]
# Throwaway spike crates live here, standalone (own Cargo.lock), excluded from the
# workspace so an alpha/experimental dependency never touches the real lockfile.
exclude = ["spikes/"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# P4.1: Resolve pre-release crypto dep conflicts between russh 0.61.x and
# ironrdp-connector 0.9.0 (which depends on picky/sspi with conflicting pinned
# pre-release crypto crates).
#
# Solution: vendor ironrdp-connector 0.9.0 and make its picky/sspi/url deps
# OPTIONAL behind a `credssp` feature. Since ConMan uses TLS-only auth
# (enable_credssp: false), CredSSP is never exercised and picky/sspi are
# never compiled, eliminating the conflict entirely.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-async = { path = "vendor/ironrdp-async" }
