[workspace]
resolver = "3"
members = [
    "crates/cm-core",
    "crates/cm-storage",
    "crates/cm-secrets",
    "crates/cm-session",
    "crates/cm-platform",
    "crates/cm-ui",
    "crates/conman",
]
# Throwaway spike crates live here, standalone (own Cargo.lock), excluded from the
# workspace so an alpha/experimental dependency never touches the real lockfile.
exclude = ["spikes/"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# P6.3 (gap 26): release-build tuning. Measured on Linux (see the P6.3
# report for the before/after binary-size and clean-build-time numbers):
# thin LTO + stripping cut the shipped binary noticeably with a modest link-
# time cost; codegen-units=1 trades a slower release build for better
# cross-crate optimization, acceptable since release builds are infrequent
# (CI/release, not the inner dev loop -- `cargo build`/`cargo run` default to
# the unaffected dev profile).
[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# P4.1: Resolve pre-release crypto dep conflicts between russh 0.61.x and
# ironrdp-connector 0.9.0 (which depends on picky/sspi with conflicting pinned
# pre-release crypto crates).
#
# Solution: vendor ironrdp-connector 0.9.0 and make its picky/sspi/url deps
# OPTIONAL behind a `credssp` feature. Since ConMan uses TLS-only auth
# (enable_credssp: false), CredSSP is never exercised and picky/sspi are
# never compiled, eliminating the conflict entirely.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-async = { path = "vendor/ironrdp-async" }
# P9.1: vendor sspi 0.21.0 with its exact RustCrypto RC pins re-aligned to the
# snapshot russh 0.61.2 uses (picky rc.24 / rsa rc.18 / ecdsa rc.18 / p256-p521
# rc.10). Stock sspi 0.21.0 pins picky=rc.23+rsa=rc.17 and sspi 0.21.1 pins
# picky=rc.25 (ecdsa rc.22 / p256 rc.14) — neither unifies with russh's exact
# pins. See docs/devel/memos/P9.1-credssp-dep-audit.md and
# docs/devel/tasks/CLEANUP-credssp-vendoring.md (removal trigger).
sspi = { path = "vendor/sspi" }
